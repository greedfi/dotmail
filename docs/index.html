<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src data:; connect-src 'self'; frame-src 'self' about:; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>.mail — your Grok Bot's inbox</title>
<meta name="description" content="Open the .mail inbox your Grok Bot sent you, right in your browser. Nothing is uploaded: no server, no accounts, no tracking.">
<meta property="og:type" content="website">
<meta property="og:site_name" content=".mail">
<meta property="og:title" content=".mail — your Grok Bot's inbox">
<meta property="og:description" content="Open the .mail inbox your Grok Bot sent you, right in your browser. It never leaves your device.">
<meta property="og:url" content="https://greedfi.github.io/dotmail/">
<meta property="og:image" content="https://greedfi.github.io/dotmail/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content=".mail logo next to a fictional demo inbox">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content=".mail — your Grok Bot's inbox">
<meta name="twitter:description" content="Open the .mail inbox your Grok Bot sent you, right in your browser. It never leaves your device.">
<meta name="twitter:image" content="https://greedfi.github.io/dotmail/og.png">
<link rel="icon" href="logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content=".mail">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#101010;--fg:#e7e9ea;--mut:#8b98a5;--line:#2f3336;--acc:#1d9bf0;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.welcome{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:520px;text-align:center}
.card svg.lg{width:150px;height:auto;color:var(--fg);margin-bottom:18px}
h1{font-size:22px;margin:0 0 6px;font-weight:700}p{margin:0;color:var(--mut)}
.more{margin:12px 0 0;font-size:13px;color:var(--mut)}.more button.lnk{font:inherit;font-weight:400;padding:0;border:0;border-radius:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer}.more button.lnk:hover{color:var(--fg)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button,.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button.pri{background:var(--fg);color:#0f1419;border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.small{font-size:13px;color:var(--mut);margin-top:12px}
.err{color:#f4212e;font-size:14px;min-height:20px;margin-top:8px}
label.rem{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer;vertical-align:middle}
.last{margin-top:16px;font-size:14px;display:none;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.last button{padding:6px 14px;font-size:13px}
.viewer{position:fixed;inset:0;display:none;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.bar .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar button{padding:5px 14px;font-size:13px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
body.viewing .welcome{display:none}body.viewing .viewer{display:flex}
footer{margin-top:28px;font-size:12px;color:var(--mut)}footer a{color:var(--mut)}
.itip{position:fixed;z-index:50;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 40px);display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;background:#16181c;color:var(--fg);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);font-size:14px}
.itip[hidden]{display:none}.it-b{flex:1;min-width:0}.it-h{font-weight:700}.it-t{color:var(--mut);font-size:13px;margin-top:2px}
.it-t svg{width:15px;height:15px;vertical-align:-2px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.it-i{padding:7px 16px;font-size:13px}.it-x{border:0;padding:6px 9px;color:var(--mut);font-size:15px;line-height:1}
.bar{padding-top:max(6px,env(safe-area-inset-top))}
.lock[hidden]{display:none}body.locked .welcome:not(.lock){display:none}body.locked .lock{display:flex}
.pc{display:block;width:100%;max-width:300px;margin:22px auto 0;font:inherit;font-size:17px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#16181c;color:var(--fg);text-align:center}
.pc:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.paste{margin:24px 0 0;text-align:left}.pl{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.prow{display:flex;gap:8px}.prow textarea{resize:none;height:44px;line-height:22px;overflow:hidden;white-space:nowrap;flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#16181c;color:var(--fg)}
.prow textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}.prow button{padding:10px 16px;flex:none}
.phint{font-size:12.5px;color:var(--mut);margin-top:6px;display:none}body.app-empty .phint{display:block}
body.app-empty .paste{margin:26px 0 8px;padding:16px;border:1px solid var(--acc);border-radius:16px;background:rgba(29,155,240,.07)}
@media (max-width:420px){.bar{gap:6px}.bar button{padding:5px 10px}}
</style></head><body>
<main class="welcome"><div class="card">
<svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 36" role="img" aria-label=".mail"><g class="lg-bot" transform="translate(-4 -3.5)" style="stroke:none"><circle class="lg-ball" cx="21" cy="20" r="16" style="fill:var(--acc,#1d9bf0)"/><ellipse cx="22.74" cy="14.6" rx="1.8" ry="4.7" transform="rotate(-37 22.74 14.6)" style="fill:#101010"/><ellipse cx="30.5" cy="11.2" rx="1.55" ry="4.6" transform="rotate(-37 30.5 11.2)" style="fill:#101010"/><circle cx="34" cy="33" r="4.3" style="fill:var(--fg,#e7e9ea);stroke:var(--bg,#101010);stroke-width:1.2"/></g><g class="lg-word" transform="translate(3.6 4.9) scale(.95)" style="fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round"><path d="M38 28V18.5A4.25 4.25 0 0 1 46.5 18.5V28M46.5 18.5A4.25 4.25 0 0 1 55 18.5V28"/><ellipse cx="65" cy="21.5" rx="5.2" ry="6"/><path d="M70.2 15.5V28"/><path d="M77.5 16V28"/><circle cx="77.5" cy="9.3" r="2.4" style="fill:currentColor;stroke:none"/><path d="M85 5V28"/></g></svg>
<h1>Your inbox, in your browser</h1>
<p>Paste the .mail link your bot sent. It never leaves your device.</p>
<form class="paste" id="paste" autocomplete="off"><label for="linkIn" class="pl">Paste your .mail link</label>
<div class="prow"><textarea id="linkIn" rows="1" wrap="off" autocorrect="off" placeholder="https://greedfi.github.io/dotmail/#m=…" aria-label="Your .mail link" spellcheck="false" autocapitalize="off"></textarea><button type="button" id="pasteBtn">Paste</button><button type="submit" class="pri" id="linkOpen">Open</button></div>
<div class="phint" id="phint">Copy the link your bot sent, then paste it here once. .mail remembers it.</div></form>
<div class="more"><button type="button" class="lnk" id="demoBtn">Try the demo</button></div>
<div class="err" id="err" role="alert"></div>
<div class="last" id="last"><span id="lastName"></span><button type="button" id="reopen">Reopen</button><button type="button" id="forget">Forget</button></div>
<footer><a href="https://github.com/greedfi/dotmail">Source on GitHub</a></footer>
</div></main>
<main class="lock welcome" id="lock" hidden><form class="card" id="lockForm" autocomplete="off">
<svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 36" aria-hidden="true"><g class="lg-bot" transform="translate(-4 -3.5)" style="stroke:none"><circle class="lg-ball" cx="21" cy="20" r="16" style="fill:var(--acc,#1d9bf0)"/><ellipse cx="22.74" cy="14.6" rx="1.8" ry="4.7" transform="rotate(-37 22.74 14.6)" style="fill:#101010"/><ellipse cx="30.5" cy="11.2" rx="1.55" ry="4.6" transform="rotate(-37 30.5 11.2)" style="fill:#101010"/><circle cx="34" cy="33" r="4.3" style="fill:var(--fg,#e7e9ea);stroke:var(--bg,#101010);stroke-width:1.2"/></g><g class="lg-word" transform="translate(3.6 4.9) scale(.95)" style="fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round"><path d="M38 28V18.5A4.25 4.25 0 0 1 46.5 18.5V28M46.5 18.5A4.25 4.25 0 0 1 55 18.5V28"/><ellipse cx="65" cy="21.5" rx="5.2" ry="6"/><path d="M70.2 15.5V28"/><path d="M77.5 16V28"/><circle cx="77.5" cy="9.3" r="2.4" style="fill:currentColor;stroke:none"/><path d="M85 5V28"/></g></svg>
<h1>Enter passcode</h1><p>This .mail inbox is locked. It is decrypted on this device only.</p>
<input type="password" id="pc" class="pc" placeholder="Passcode" aria-label="Passcode" autocomplete="current-password" required>
<div class="err" id="lockErr" role="alert"></div>
<div class="btns"><button class="pri" type="submit" id="unlock">Unlock</button><button type="button" id="lockForget">Forget this inbox</button></div>
</form></main>
<section class="viewer" id="viewer"><div class="bar"><span class="nm" id="nm"></span><button type="button" id="pasteNew">Paste new link</button><button type="button" id="forgetV" hidden>Forget this inbox</button><button type="button" id="close">Close</button></div>
<iframe id="frame" sandbox="allow-scripts" allow="clipboard-write" referrerpolicy="no-referrer" title=".mail inbox"></iframe></section>
<div class="itip" id="itip" hidden role="dialog" aria-label="Add .mail to your Home Screen"><div class="it-b"><div class="it-h">Add .mail to your Home Screen</div><div class="it-t" id="itipText"></div></div><button type="button" class="pri it-i" id="itipInstall" hidden>Install</button><button type="button" class="it-x" id="itipX" aria-label="Dismiss">&#x2715;</button></div>
<script src="app.js"></script>
</body></html>
