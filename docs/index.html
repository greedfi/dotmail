<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src data:; connect-src 'self'; frame-src 'self' about:; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>.mail viewer</title>
<link rel="icon" href="logo.svg">
<style>
:root{--bg:#101010;--fg:#e7e9ea;--mut:#8b98a5;--line:#2f3336;--acc:#1d9bf0;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.welcome{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:520px;text-align:center}
.card svg.lg{width:150px;height:auto;color:var(--fg);margin-bottom:18px}
h1{font-size:22px;margin:0 0 6px;font-weight:700}p{margin:0;color:var(--mut)}
.drop{margin:26px 0 16px;border:1.5px dashed var(--line);border-radius:16px;padding:30px 16px;transition:.15s}
.drop.over{border-color:var(--acc);background:rgba(29,155,240,.08)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button,.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button.pri{background:var(--fg);color:#0f1419;border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.small{font-size:13px;color:var(--mut);margin-top:12px}
.err{color:#f4212e;font-size:14px;min-height:20px;margin-top:8px}
label.rem{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);margin-top:10px;cursor:pointer}
.last{margin-top:16px;font-size:14px;display:none;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.last button{padding:6px 14px;font-size:13px}
.viewer{position:fixed;inset:0;display:none;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.bar .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar button{padding:5px 14px;font-size:13px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
body.viewing .welcome{display:none}body.viewing .viewer{display:flex}
footer{margin-top:28px;font-size:12px;color:var(--mut)}footer a{color:var(--mut)}
</style></head><body>
<main class="welcome"><div class="card">
<svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 36" role="img" aria-label=".mail"><g class="lg-bot" transform="translate(-4 -3.5)" style="stroke:none"><circle class="lg-ball" cx="21" cy="20" r="16" style="fill:var(--acc,#1d9bf0)"/><ellipse cx="22.74" cy="14.6" rx="1.8" ry="4.7" transform="rotate(-37 22.74 14.6)" style="fill:#101010"/><ellipse cx="30.5" cy="11.2" rx="1.55" ry="4.6" transform="rotate(-37 30.5 11.2)" style="fill:#101010"/><circle cx="34" cy="33" r="4.3" style="fill:var(--fg,#e7e9ea);stroke:var(--bg,#101010);stroke-width:1.2"/></g><g class="lg-word" transform="translate(3.6 4.9) scale(.95)" style="fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round"><path d="M38 28V18.5A4.25 4.25 0 0 1 46.5 18.5V28M46.5 18.5A4.25 4.25 0 0 1 55 18.5V28"/><ellipse cx="65" cy="21.5" rx="5.2" ry="6"/><path d="M70.2 15.5V28"/><path d="M77.5 16V28"/><circle cx="77.5" cy="9.3" r="2.4" style="fill:currentColor;stroke:none"/><path d="M85 5V28"/></g></svg>
<h1>Your inbox, in your browser</h1>
<p>Open the .mail file your bot sent you. It never leaves your device.</p>
<div class="drop" id="drop">
<div>Drop your .mail file here</div>
<div class="btns"><button class="pri" id="openBtn" type="button">Open file</button><button id="demoBtn" type="button">Try the demo</button></div>
<label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
<div class="err" id="err" role="alert"></div>
</div>
<div class="last" id="last"><span id="lastName"></span><button type="button" id="reopen">Reopen</button><button type="button" id="forget">Forget</button></div>
<div class="small">Accepts the .mail .html page or its JSON data. Everything runs locally: no uploads, no accounts, no tracking.</div>
<footer><a href="https://github.com/greedfi/dotmail">Source on GitHub</a></footer>
<input type="file" id="file" accept=".html,.htm,.json,text/html,application/json" hidden>
</div></main>
<section class="viewer" id="viewer"><div class="bar"><span class="nm" id="nm"></span><button type="button" id="close">Close</button></div>
<iframe id="frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title=".mail inbox"></iframe></section>
<script src="app.js"></script>
</body></html>
